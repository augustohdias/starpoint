<!doctype html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/public/tailwind.css">
    <title>Starpoint - Characters</title>
</head>

<body
    class="bg-background text-on-surface relative mt-16 m-auto max-w-screen-2xl min-h-screen box-border flex flex-col items-start px-3 pb-3">
    <header class="flex gap-3 items-center md:justify-start justify-center mb-3 w-full">
        <img src="/public/img/logo.png" class="w-9 h-9">
        <h1 class="text-4xl mt-4 font-black mb-4 text-on-background">Starpoint</h1>
    </header>
    <div class="md:grid md:grid-cols-sidebar flex flex-col gap-5 w-full h-fit">
        <nav class="px-3 py-5 gap-3 flex flex-col bg-surface-container-low rounded-3xl h-fit w-full">
            <a href="/"
                class="px-5 py-3 flex gap-3 items-center rounded-full hover:bg-surface-container-high text-on-surface text-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                    class="fill-on-surface">
                    <path
                        d="M520-600v-240h320v240H520ZM120-440v-400h320v400H120Zm400 320v-400h320v400H520Zm-400 0v-240h320v240H120Zm80-400h160v-240H200v240Zm400 320h160v-240H600v240Zm0-480h160v-80H600v80ZM200-200h160v-80H200v80Zm160-320Zm240-160Zm0 240ZM360-280Z" />
                </svg>
                Dashboard
            </a>
            <a href="/player"
                class="px-5 py-3 flex gap-3 items-center rounded-full hover:bg-surface-container-high text-on-surface text-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                    class="fill-on-surface">
                    <path
                        d="M40-160v-112q0-34 17.5-62.5T104-378q62-31 126-46.5T360-440q66 0 130 15.5T616-378q29 15 46.5 43.5T680-272v112H40Zm720 0v-120q0-44-24.5-84.5T666-434q51 6 96 20.5t84 35.5q36 20 55 44.5t19 53.5v120H760ZM360-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47Zm400-160q0 66-47 113t-113 47q-11 0-28-2.5t-28-5.5q27-32 41.5-71t14.5-81q0-42-14.5-81T544-792q14-5 28-6.5t28-1.5q66 0 113 47t47 113ZM120-240h480v-32q0-11-5.5-20T580-306q-54-27-109-40.5T360-360q-56 0-111 13.5T140-306q-9 5-14.5 14t-5.5 20v32Zm240-320q33 0 56.5-23.5T440-640q0-33-23.5-56.5T360-720q-33 0-56.5 23.5T280-640q0 33 23.5 56.5T360-560Zm0 320Zm0-400Z" />
                </svg>
                Players
            </a>
            <div
                class="px-5 py-3 flex gap-3 items-center bg-primary rounded-full w-full font-bold text-on-primary text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                    class="fill-on-primary">
                    <path
                        d="m233-120 65-281L80-590l288-25 112-265 112 265 288 25-218 189 65 281-247-149-247 149Z" />
                </svg>
                Characters
            </div>
            <a href="https://github.com/Duosion/starpoint"
                class="px-5 py-3 flex gap-3 items-center rounded-full hover:bg-surface-container-high text-on-surface text-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                    class="fill-on-surface">
                    <path
                        d="M320-240 80-480l240-240 57 57-184 184 183 183-56 56Zm320 0-57-57 184-184-183-183 56-56 240 240-240 240Z" />
                </svg>
                Source Code
            </a>
        </nav>
        <article class="w-full flex flex-col gap-5">
            <section class="p-5 border border-outline-variant bg-surface-container rounded-3xl w-full flex flex-col gap-4">
                <h2 class="text-2xl font-bold text-on-background">Character Ranking</h2>
                <p class="text-on-surface-variant">DPS score = ATK × skill multiplier (lv100 stats, base skill data).
                    Sort by clicking the headers.</p>
                <div class="flex flex-wrap gap-3 items-center">
                    <input id="search" type="search" placeholder="Search name..."
                        class="bg-surface-container-high border border-outline-variant rounded-full px-4 h-[40px] flex-1 min-w-[200px] text-on-surface focus:outline-none focus:border-primary" />
                    <select id="rarity"
                        class="bg-surface-container-high border border-outline-variant rounded-full px-4 h-[40px] text-on-surface focus:outline-none focus:border-primary">
                        <option value="">All rarities</option>
                        <option value="5">5★</option>
                        <option value="4">4★</option>
                        <option value="3">3★</option>
                        <option value="2">2★</option>
                        <option value="1">1★</option>
                    </select>
                    <select id="element"
                        class="bg-surface-container-high border border-outline-variant rounded-full px-4 h-[40px] text-on-surface focus:outline-none focus:border-primary">
                        <option value="">All elements</option>
                        <option value="fire">Fire</option>
                        <option value="water">Water</option>
                        <option value="thunder">Thunder</option>
                        <option value="wind">Wind</option>
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                    </select>
                    <span id="count" class="text-on-surface-variant font-semibold"></span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-separate border-spacing-y-1">
                        <thead>
                            <tr class="text-on-surface-variant select-none">
                                <th class="pl-5 pr-2 py-2 font-semibold cursor-pointer" data-sort="rank">#</th>
                                <th class="px-2 py-2 font-semibold cursor-pointer" data-sort="name">Name</th>
                                <th class="px-2 py-2 font-semibold cursor-pointer" data-sort="rarity">Rarity</th>
                                <th class="px-2 py-2 font-semibold cursor-pointer" data-sort="element">Element</th>
                                <th class="px-2 py-2 font-semibold cursor-pointer" data-sort="atk">ATK</th>
                                <th class="px-2 py-2 font-semibold cursor-pointer" data-sort="hp">HP</th>
                                <th class="px-2 py-2 font-semibold cursor-pointer" data-sort="mult">Skill mult</th>
                                <th class="px-2 py-2 font-semibold cursor-pointer" data-sort="score">DPS score</th>
                            </tr>
                        </thead>
                        <tbody id="rows"></tbody>
                    </table>
                </div>
            </section>
        </article>
    </div>

    <script>
        var DATA = [];
        var sortKey = "score";
        var sortDir = -1;

        var ELEMENT_COLORS = {
            fire: "text-red-500",
            water: "text-blue-400",
            thunder: "text-yellow-500",
            wind: "text-emerald-400",
            light: "text-amber-300",
            dark: "text-purple-400"
        };

        fetch("/public/characters.json")
            .then(function (r) { return r.json(); })
            .then(function (data) {
                DATA = data;
                render();
            });

        document.getElementById("search").addEventListener("input", render);
        document.getElementById("rarity").addEventListener("change", render);
        document.getElementById("element").addEventListener("change", render);

        var headers = document.querySelectorAll("th[data-sort]");
        for (var i = 0; i < headers.length; i++) {
            headers[i].addEventListener("click", function () {
                var key = this.getAttribute("data-sort");
                if (sortKey === key) {
                    sortDir = -sortDir;
                } else {
                    sortKey = key;
                    sortDir = key === "name" || key === "element" ? 1 : -1;
                }
                render();
            });
        }

        function filtered() {
            var q = document.getElementById("search").value.trim().toLowerCase();
            var rarity = document.getElementById("rarity").value;
            var element = document.getElementById("element").value;
            var list = DATA.filter(function (c) {
                if (q && c.name.toLowerCase().indexOf(q) === -1) return false;
                if (rarity && String(c.rarity) !== rarity) return false;
                if (element && c.element !== element) return false;
                return true;
            });
            list.sort(function (a, b) {
                var va = a[sortKey] === null ? -1 : a[sortKey];
                var vb = b[sortKey] === null ? -1 : b[sortKey];
                if (typeof va === "string") {
                    return va.localeCompare(vb) * sortDir;
                }
                return (va - vb) * sortDir;
            });
            return list;
        }

        function render() {
            var list = filtered();
            var tbody = document.getElementById("rows");
            tbody.innerHTML = "";
            var maxScore = Math.max.apply(null, DATA.map(function (c) { return c.score || 0; }));
            for (var i = 0; i < list.length; i++) {
                var c = list[i];
                var tr = document.createElement("tr");
                tr.className = "bg-surface-container-low" + (i < 3 && sortKey === "score" && sortDir === -1 ? " outline outline-1 outline-primary" : "");

                var rank = document.createElement("td");
                rank.className = "pl-5 pr-2 py-3 rounded-l-3xl font-bold text-on-surface-variant w-12";
                rank.textContent = i + 1;

                var name = document.createElement("td");
                name.className = "px-2 py-3 font-semibold";
                name.textContent = c.name;
                name.title = "id " + c.id;

                var rarity = document.createElement("td");
                rarity.className = "px-2 py-3 whitespace-nowrap";
                rarity.textContent = c.rarity + "\u2605";

                var element = document.createElement("td");
                element.className = "px-2 py-3 capitalize font-medium " + (ELEMENT_COLORS[c.element] || "");
                element.textContent = c.element;

                var atk = document.createElement("td");
                atk.className = "px-2 py-3";
                atk.textContent = c.atk;

                var hp = document.createElement("td");
                hp.className = "px-2 py-3";
                hp.textContent = c.hp;

                var mult = document.createElement("td");
                mult.className = "px-2 py-3";
                mult.textContent = c.mult !== null ? (c.mult / 10).toFixed(1) + "%" : "\u2014";
                if (c.mult === null) mult.className += " text-on-surface-variant";

                var score = document.createElement("td");
                score.className = "px-2 py-3 pr-5 rounded-r-3xl font-bold";
                if (c.score !== null && maxScore > 0) {
                    var pct = Math.round((c.score / maxScore) * 100);
                    score.textContent = c.score;
                    var bar = document.createElement("div");
                    bar.className = "h-1 rounded-full bg-primary mt-1";
                    bar.style.width = Math.max(2, pct) + "%";
                    score.appendChild(bar);
                } else {
                    score.textContent = "\u2014";
                    score.className += " text-on-surface-variant";
                }

                tr.appendChild(rank);
                tr.appendChild(name);
                tr.appendChild(rarity);
                tr.appendChild(element);
                tr.appendChild(atk);
                tr.appendChild(hp);
                tr.appendChild(mult);
                tr.appendChild(score);
                tbody.appendChild(tr);
            }
            document.getElementById("count").textContent = list.length + " characters";
        }
    </script>
</body>

</html>
